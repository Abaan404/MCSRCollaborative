plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

    maven {
        name = "SuperSanta"
        url = "https://maven.supersanta.me/snapshots"
    }

    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/mcsr-collaborative.classtweaker")

	mods {
		"mcsr-collaborative" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    include(implementation("net.casualchampionships:arcade-replay:${project.arcade_version}"))

    include(implementation("net.casualchampionships:arcade-interceptor:${project.arcade_version}"))
    include(implementation("net.casualchampionships:arcade-commands:${project.arcade_version}"))
    include(implementation("net.casualchampionships:arcade-event-registry:${project.arcade_version}"))
    include(implementation("net.casualchampionships:arcade-events-server:${project.arcade_version}"))
    include(implementation("net.casualchampionships:arcade-resource-pack-host:${project.arcade_version}"))
    include(implementation("net.casualchampionships:arcade-utils:${project.arcade_version}"))

    // HACKY: manually include jda deps (https://central.sonatype.com/artifact/net.dv8tion/JDA/6.4.1/dependencies)
    include(implementation("com.fasterxml.jackson.core:jackson-core:${project.jackson_core_version}"))
    include(implementation("com.fasterxml.jackson.core:jackson-databind:${project.jackson_databind_version}"))
    include(implementation("com.neovisionaries:nv-websocket-client:${project.nv_websocket_version}"))
    include(implementation("com.squareup.okhttp3:okhttp-jvm:${project.okhttp_version}"))
    include(implementation("net.sf.trove4j:core:${project.core_version}"))
    include(implementation("org.apache.commons:commons-collections4:${project.commons_collections4_version}"))
    include(implementation("org.slf4j:slf4j-api:${project.slf4j_api_version}"))
    include(implementation("com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"))
    include(implementation("com.squareup.okio:okio-jvm:${project.okio_jvm_version}"))

    // discord chat link
    include(implementation("net.dv8tion:JDA:${project.discord_jda_version}") { // replace $version with the latest version
      // Optionally disable audio natives to reduce jar size by excluding `opus-java` and `tink`
      // Gradle DSL:
      exclude module: 'opus-java' // required for encoding audio into opus, not needed if audio is already provided in opus encoding
      exclude module: 'tink' // required for encrypting and decrypting audio
      // Kotlin DSL:
      // exclude(module="opus-java") // required for encoding audio into opus, not needed if audio is already provided in opus encoding
      // exclude(module="tink") // required for encrypting and decrypting audio
    })
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
